[package]
name = "lake-ffi"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "C ABI over the official lake-driver crate, linked statically into the pdo_lake PHP extension"
repository = "https://github.com/stringke/lake-php"
publish = false

[lib]
name = "lake_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
lake-client = "=0.34.0"
lake-driver = { version = "=0.34.0", features = ["flight-sql"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "fs", "io-util"] }
tokio-stream = "0.1"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
