# Local Databend with S3 storage for running the test suite, including presigned URLs and GET.
#
#   docker compose up -d --wait
#   make test NO_INTERACTION=1
#
# Databend shares the network namespace of the S3 service so the presigned URLs it issues
# (http://127.0.0.1:9000/...) resolve to the same S3 endpoint from the host.
name: lake-php

services:
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: lakeaccess
      RUSTFS_SECRET_KEY: lakesecret123
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8900:8900"
      - "127.0.0.1:9000:9000"

  s3-bucket:
    image: curlimages/curl:latest
    network_mode: service:s3
    depends_on:
      - s3
    command: >-
      sh -c 'until curl -sf -o /dev/null -X PUT --aws-sigv4 aws:amz:us-east-1:s3 -u lakeaccess:lakesecret123 http://127.0.0.1:9000/databend
      || curl -s --aws-sigv4 aws:amz:us-east-1:s3 -u lakeaccess:lakesecret123 http://127.0.0.1:9000/databend | grep -q ListBucketResult; do sleep 1; done'

  databend:
    image: datafuselabs/databend:v1.2.949-nightly
    network_mode: service:s3
    depends_on:
      s3-bucket:
        condition: service_completed_successfully
    environment:
      QUERY_DEFAULT_USER: lake
      QUERY_DEFAULT_PASSWORD: lake
      QUERY_STORAGE_TYPE: s3
      AWS_S3_ENDPOINT: http://127.0.0.1:9000
      AWS_S3_BUCKET: databend
      AWS_ACCESS_KEY_ID: lakeaccess
      AWS_SECRET_ACCESS_KEY: lakesecret123
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u lake:lake -H 'Content-Type: application/json' -d '{\"sql\":\"select 1\"}' http://127.0.0.1:8000/v1/query/ | grep -q '\"state\":\"Succeeded\"'"]
      interval: 2s
      timeout: 5s
      retries: 60
